<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chicago ArcGIS WebGL Capture</title>
<style>html,body,arcgis-map{width:100%;height:100%;margin:0;display:block;overflow:hidden;background:#08111e}</style>

<script type="module" src="https://js.arcgis.com/5.1/"></script>
<arcgis-map id="view" basemap="topo-vector" center="-87.6298,41.8781" zoom="11"></arcgis-map>

<script type="module">
  const view = document.querySelector('#view');
  let captureTick = null;
  const captureRequest = async (path) => {
    const response = await fetch(path, { method: 'POST' });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || `Capture request failed (${response.status})`);
    return result;
  };

  // No UI is added: call these from your app, DevTools, or an automation harness.
  // start() opens the capture; stop() finalizes it and resolves with its saved path.
  window.metalCapture = Object.freeze({
    start: async () => {
      const result = await captureRequest('/api/capture/start');
      captureTick?.(); // Begin the native Metal trace before the next app operation.
      return result;
    },
    stop: () => captureRequest('/api/capture/stop'),
    status: async () => (await fetch('/api/status')).json(),
  });
  const waitForCaptureClock = async () => {
    for (let attempt = 0; attempt < 200; attempt += 1) {
      if ((await window.metalCapture.status()).captureClockReady) return;
      await new Promise((resolve) => setTimeout(resolve, 50));
    }
    throw new Error('The Metal capture clock did not become ready.');
  };

  view.addEventListener('arcgisViewReadyChange', () => {
    const points = [
      [-87.6298, 41.8781, '#f97316'], // Loop
      [-87.6207, 41.8902, '#22c55e'], // River North
      [-87.6476, 41.8925, '#38bdf8'], // Wicker Park
      [-87.6064, 41.8610, '#e879f9'], // Near South Side
      [-87.6675, 41.8740, '#facc15'], // West Loop
    ];
    for (const [longitude, latitude, color] of points) {
      view.graphics.add({
        geometry: { type: 'point', longitude, latitude },
        symbol: {
          type: 'simple-marker', style: 'circle', color,
          size: 16, outline: { color: '#ffffff', width: 2 },
        },
      });
    }

    setTimeout(async () => {
      const screenRect = {
        x: Math.round(view.clientWidth * 0.35),
        y: Math.round(view.clientHeight * 0.35),
        width: Math.round(view.clientWidth * 0.30),
        height: Math.round(view.clientHeight * 0.30),
      };
      let recording = false;
      try {
        await waitForCaptureClock();
        await window.metalCapture.start();
        recording = true;
        const hitTestResult = await view.hitTest(screenRect);
        window.latestHitTest = hitTestResult;
        console.info('ScreenRect hitTest result:', hitTestResult);
      } finally {
        if (recording) {
          const trace = await window.metalCapture.stop();
          window.latestHitTestTrace = trace.path;
          console.info(`Saved GPU trace: ${trace.path}`);
        }
      }
    }, 1000);
  }, { once: true });

  // This only arms WebKit's trace switch. ArcGIS itself renders via WebGL.
  if (navigator.gpu) {
    const adapter = await navigator.gpu.requestAdapter();
    const device = await adapter?.requestDevice();
    if (device) {
      const module = device.createShaderModule({ code: '@compute @workgroup_size(1) fn main() {}' });
      const pipeline = device.createComputePipeline({ layout: 'auto', compute: { module, entryPoint: 'main' } });
      const tick = () => {
        const encoder = device.createCommandEncoder({ label: 'capture-trigger' });
        const pass = encoder.beginComputePass({ label: 'capture-trigger pass' });
        pass.setPipeline(pipeline); pass.dispatchWorkgroups(1); pass.end();
        device.queue.submit([encoder.finish()]);
      };
      captureTick = tick;
      setInterval(tick, 16);
      tick();
      fetch('/api/clock-ready', { method: 'POST' }).catch(() => {});
    }
  }
</script>
